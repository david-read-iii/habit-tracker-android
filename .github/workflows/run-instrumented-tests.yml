name: "Run Instrumented Tests"

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  run-instrumented-tests:
    name: Run Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            echo "Waiting for boot to complete..."
            until adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q "^1$"; do sleep 3; done
            echo "Boot completed."
          
            echo "Waiting for PackageManager..."
            until adb shell pm path android 2>/dev/null | grep -q "package:"; do sleep 3; done
            echo "PackageManager ready."

            # Recover ADB transport in case emulator boot leaves device offline.
            adb reconnect || true
            adb wait-for-device
          
            sleep 5
            ./gradlew connectedDebugAndroidTest --stacktrace